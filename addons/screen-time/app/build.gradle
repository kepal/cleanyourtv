plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simonegiansante.screentime'
    compileSdk 34

    defaultConfig {
        applicationId 'com.simonegiansante.screentime'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.11'
    }

    signingConfigs {
        // Sideloaded over ADB, never published. A fixed key (not the per-machine debug key) so a build
        // from CI installs over the previous one with `pm install -r` and keeps the PIN and settings.
        sideload {
            storeFile file('screen-time.keystore')
            storePassword 'android'
            keyAlias 'screentime'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No libraries in the APK. Test only: plain JVM tests in src/test.
    testImplementation 'junit:junit:4.13.2'
}
